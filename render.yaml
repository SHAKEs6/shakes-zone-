services:
  - type: web
    name: shakes-zone-backend
    env: node
    buildCommand: npm install
    startCommand: node backend/server.js
    plan: free
    scaling:
      minInstances: 1
      maxInstances: 3
    healthCheck:
      path: /api/test
      checkIntervalSeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
